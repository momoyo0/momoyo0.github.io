<!--
  Public Codrops rough-paper recipe:
  https://tympanus.net/codrops/2019/02/19/svg-filter-effects-creating-texture-with-feturbulence/
  The paper color is supplied by CSS; this repeating SVG is only the lit
  fractal-noise surface.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <filter id="roughpaper" x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="linearRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" stitchTiles="stitch" result="noise" />
    <feDiffuseLighting in="noise" lighting-color="#fff" surfaceScale="2">
      <feDistantLight azimuth="45" elevation="60" />
    </feDiffuseLighting>
  </filter>
  <rect width="200" height="200" fill="#776b5d" filter="url(#roughpaper)" opacity="0.18" />
</svg>
