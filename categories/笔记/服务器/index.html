<script>
(() => {
  const storageKey = 'theme';
  const backgroundStorageKey = 'blog-background';
  const backgroundValues = ['default', 'paper', 'cosine-pink'];
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  const root = document.documentElement;

  const readBackground = () => {
    try {
      const value = window.localStorage.getItem(backgroundStorageKey);
      return backgroundValues.includes(value) ? value : 'default';
    } catch (error) {
      return 'default';
    }
  };

  // Apply the saved surface before the first paint so a page refresh does not
  // briefly flash the default background.
  root.dataset.background = readBackground();

  const readPreference = () => {
    try {
      const value = window.localStorage.getItem(storageKey);
      return value === 'dark' || value === 'light' ? value : null;
    } catch (error) {
      return null;
    }
  };

  const resolveTheme = preference => preference || (darkQuery.matches ? 'dark' : 'light');

  const applyTheme = (theme, preference = readPreference()) => {
    const isDark = theme === 'dark';
    root.classList.toggle('dark', isDark);
    root.classList.toggle('light', !isDark);
    root.dataset.theme = theme;
    root.dataset.themePreference = preference || 'system';
    root.style.colorScheme = theme;

    const themeColor = document.querySelector('meta[name="theme-color"]');
    if (themeColor) themeColor.setAttribute('content', isDark ? '#21252b' : '#f8fafc');

    window.dispatchEvent(new CustomEvent('theme:change', {
      detail: { theme, preference: preference || 'system' }
    }));
  };

  const setPreference = preference => {
    try {
      if (preference === 'dark' || preference === 'light') {
        window.localStorage.setItem(storageKey, preference);
      } else {
        window.localStorage.removeItem(storageKey);
        preference = null;
      }
    } catch (error) {
      // The selected theme still applies for this page when storage is blocked.
    }
    applyTheme(resolveTheme(preference), preference);
  };

  const preference = readPreference();
  applyTheme(resolveTheme(preference), preference);

  const followSystem = () => {
    if (!readPreference()) applyTheme(resolveTheme(null), null);
  };
  if (darkQuery.addEventListener) darkQuery.addEventListener('change', followSystem);
  else if (darkQuery.addListener) darkQuery.addListener(followSystem);

  window.addEventListener('storage', event => {
    if (event.key !== storageKey && event.key !== null) return;
    const nextPreference = readPreference();
    applyTheme(resolveTheme(nextPreference), nextPreference);
  });

  window.BlogTheme = {
    getPreference: readPreference,
    getTheme: () => root.dataset.theme || resolveTheme(readPreference()),
    setPreference,
    toggle: () => setPreference(root.dataset.theme === 'dark' ? 'light' : 'dark'),
    followSystem: () => setPreference(null)
  };
})();
</script>

<script>
(() => {
  if (!window.NexT || !NexT.utils || typeof NexT.utils.getAffixParam !== 'function') return;

  const nativeGetAffixParam = NexT.utils.getAffixParam;
  const desktop = window.matchMedia('(min-width: 992px)');
  const documentTop = element => {
    let top = 0;
    for (let node = element; node; node = node.offsetParent) top += node.offsetTop;
    return top;
  };

  NexT.utils.getAffixParam = function() {
    const nativeParam = nativeGetAffixParam.call(this);
    if (!desktop.matches) return nativeParam;

    const main = document.querySelector('.main-inner');
    const sidebar = document.querySelector('.sidebar');
    if (!main || !sidebar) return nativeParam;

    const sidebarOffset = CONFIG.sidebar.offset || 12;
    const header = document.querySelector('.header');
    const headerHeight = header && !header.classList.contains('hide') ? header.offsetHeight : 0;
    const stickyTop = sidebarOffset + headerHeight;
    document.documentElement.style.setProperty('--toc-sticky-top', stickyTop + 'px');
    const mainTop = documentTop(main);
    const postBody = document.querySelector(
      '.content.posts-expand article.post-block > .post-body[itemprop="articleBody"]'
    );
    const pageHero = document.querySelector('.content .page-hero');
    let pagePanel = null;
    if (pageHero) {
      const content = pageHero.closest('.content');
      const wrapper = pageHero.parentElement === content ? pageHero : pageHero.parentElement;
      const candidate = wrapper && wrapper.nextElementSibling;
      if (candidate && candidate.matches('.post-block')) pagePanel = candidate;
    }
    const hasPostToc = CONFIG.page && CONFIG.page.isPost && document.querySelector('.post-toc');
    let normalTop = mainTop + stickyTop;
    if (hasPostToc && postBody) normalTop = documentTop(postBody);
    else if (pagePanel) normalTop = documentTop(pagePanel);

    sidebar.style.marginTop = Math.max(0, normalTop - mainTop) + 'px';

    return {
      top: Math.max(0, normalTop - stickyTop),
      bottom: nativeParam.bottom
    };
  };

  let resizeFrame;
  const refreshAffix = () => {
    if (!window.Affix || !Affix.element) return;
    const previousTop = Affix.element.getBoundingClientRect().top;
    Affix.element.style.top = '';
    // Recalculate from a normal affixed state. Setting `affixed` to null
    // makes NexT's initializer use the whole viewport as collider height;
    // on short index pages that incorrectly selects affix-bottom and sends
    // the overview/avatar card to the end of the document.
    Affix.element.classList.remove('affix-top', 'affix-bottom');
    Affix.element.classList.add('affix');
    Affix.affixed = false;
    Affix.unpin = null;
    Affix.pinnedOffset = null;
    Affix.offset = NexT.utils.getAffixParam();
    Affix.checkPosition();

    // current scroll position. Smooth that class switch instead of jumping
    // between the natural and fixed positions.
    const nextTop = Affix.element.getBoundingClientRect().top;
    const delta = previousTop - nextTop;
    if (Math.abs(delta) > .5 && Affix.element.animate) {
      if (Affix.element.tocAlignAnimation) Affix.element.tocAlignAnimation.cancel();
      Affix.element.tocAlignAnimation = Affix.element.animate([
        { transform: 'translateY(' + delta + 'px)' },
        { transform: 'translateY(0)' }
      ], {
        duration: 300,
        easing: 'ease'
      });
    }

    window.cancelAnimationFrame(resizeFrame);
    resizeFrame = window.requestAnimationFrame(refreshAffix);
  };

  window.addEventListener('header:heightchange', scheduleRefresh);
  window.addEventListener('header:visibilitychange', scheduleRefresh);
